# Local development: Postgres only, on 127.0.0.1:5433 so it never collides
# with another Postgres on the machine. `npm run dev` then talks to it.
name: gymrat-auth-dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymrat
      POSTGRES_USER: gymrat
      POSTGRES_PASSWORD: gymrat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymrat -d gymrat"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata_dev:

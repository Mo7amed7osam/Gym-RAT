services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymrat
      POSTGRES_PASSWORD: gymrat
      POSTGRES_DB: gymrat
    ports:
      - "5432:5432"
    volumes:
      - gymrat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymrat -d gymrat"]
      interval: 5s
      retries: 10

volumes:
  gymrat-pg:
